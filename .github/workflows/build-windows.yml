name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ClaudeCodexUsageWidget
          launcher.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodexUsageWidget-windows
          path: dist/ClaudeCodexUsageWidget.exe
          if-no-files-found: error
